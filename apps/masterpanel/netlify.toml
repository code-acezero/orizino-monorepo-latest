[build]
  # Build runs from repo root so npm workspaces resolve correctly.
  # "base" is left unset so Netlify clones from root.
  base    = "."
  command = "npm install --legacy-peer-deps --include=optional --os=linux --libc=glibc && cd apps/masterpanel && npm run build"
  publish = "apps/masterpanel/.next"

[build.environment]
  # Node 22 satisfies camera-controls >=22 requirement and is the current LTS.
  NODE_VERSION = "22"
  NPM_FLAGS    = "--legacy-peer-deps"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_PROJECT_ID,VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
