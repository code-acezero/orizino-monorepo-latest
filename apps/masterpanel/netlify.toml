# ─────────────────────────────────────────────────────────────────────
# Masterpanel Netlify build config
# REQUIRED NETLIFY UI SETTING: Set "Base directory" to  apps/masterpanel
# (matching storefront / company pattern)
# ─────────────────────────────────────────────────────────────────────
[build]
  base    = "apps/masterpanel"
  command = "cd ../.. && npm install --os=linux --libc=glibc --legacy-peer-deps && node scripts/copy-lightningcss.mjs && npm run build:masterpanel"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS    = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"
