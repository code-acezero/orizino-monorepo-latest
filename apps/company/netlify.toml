[build]
  base    = "apps/company"
  command = "npm install --legacy-peer-deps --os=linux --libc=glibc && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS    = "--legacy-peer-deps"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_PROJECT_ID,VITE_SUPABASE_URL,VITE_SUPABASE_PROJECT_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"
